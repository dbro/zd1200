<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZoneDirector traffic analytics</title>
  <style>
    body { font: 14px Arial, sans-serif; color: #27313b; margin: 24px; }
    h1 { margin: 0 0 5px; font-size: 22px; }
    #summary { color: #59636c; margin: 0 0 18px; }
    .tabs { border-bottom: 1px solid #ccd4dc; margin-bottom: 12px; }
    button { border: 1px solid #ccd4dc; border-bottom: 0; background: #f4f6f8;
      padding: 8px 14px; cursor: pointer; margin-right: 4px; }
    button.active { background: #fff; font-weight: bold; }
    table { border-collapse: collapse; width: 100%; max-width: 1120px; }
    th { color: #59636c; font-size: 12px; text-align: left; }
    th, td { border-bottom: 1px solid #e1e6ea; padding: 8px; vertical-align: middle; }
    td.number, th.number { text-align: right; white-space: nowrap; }
    .name { font-weight: bold; }
    .identifier { color: #6c7780; font: 12px monospace; margin-top: 2px; }
    .spark { width: 172px; height: 30px; display: block; }
    .empty, .error { padding: 12px; background: #f4f6f8; max-width: 700px; }
    .error { color: #9d2525; }
  </style>
</head>
<body>
  <h1>Traffic, last 24 recorded hours</h1>
  <p id="summary">Loading ZoneDirector hourly accounting…</p>
  <div class="tabs" id="tabs" hidden></div>
  <div id="content"></div>
  <script>
    const kinds = [
      ["clients", "Clients", "Client MAC"],
      ["aps", "Access points", "AP ID"],
      ["ssids", "SSIDs", "SSID ID"],
    ];
    let snapshot;
    let selected = "clients";

    const formatBytes = (value) => {
      if (!value) return "0 B";
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      const unit = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
      return `${(value / 1024 ** unit).toFixed(unit ? 1 : 0)} ${units[unit]}`;
    };

    const sparkline = (hours) => {
      const values = hours.map(([tx, rx]) => tx + rx);
      const maximum = Math.max(...values, 1);
      const points = values.map((value, index) => {
        const x = index * 172 / 23;
        const y = 28 - (value / maximum * 26);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="spark" viewBox="0 0 172 30" role="img" aria-label="hourly traffic sparkline">
        <line x1="0" y1="28" x2="172" y2="28" stroke="#d6dde3"/>
        <polyline points="${points}" fill="none" stroke="#287bb5" stroke-width="1.7"/>
      </svg>`;
    };

    const render = () => {
      const [kind, title, keyTitle] = kinds.find(([name]) => name === selected);
      const rows = snapshot[kind] || [];
      document.querySelectorAll("#tabs button").forEach((button) =>
        button.classList.toggle("active", button.dataset.kind === kind));
      if (!rows.length) {
        document.getElementById("content").innerHTML = `<p class="empty">No hourly ${title.toLowerCase()} traffic has been recorded yet.</p>`;
        return;
      }
      const body = rows.map((row) => `<tr>
        <td><div class="name">${row.name || row.id}</div><div class="identifier">ID: ${row.id}</div></td>
        <td class="number">${formatBytes(row.tx_bytes)}</td>
        <td class="number">${formatBytes(row.rx_bytes)}</td>
        <td class="number">${formatBytes(row.tx_bytes + row.rx_bytes)}</td>
        <td>${sparkline(row.hours)}</td>
      </tr>`).join("");
      document.getElementById("content").innerHTML = `<table>
        <thead><tr><th>${keyTitle}</th><th class="number">Tx</th><th class="number">Rx</th>
        <th class="number">Total</th><th>Hourly total</th></tr></thead><tbody>${body}</tbody></table>`;
    };

    fetch("zd1200-analytics-snapshot.json", { cache: "no-store" })
      .then((response) => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then((data) => {
        snapshot = data;
        if (data.status !== "ok") throw new Error(data.reason || data.status || "snapshot unavailable");
        const hours = data.window_end ? new Date(data.window_end * 1000).toLocaleString() : "no completed hour";
        document.getElementById("summary").textContent = `Based on the controller’s existing hourly accounting, ending ${hours}.`;
        const tabs = document.getElementById("tabs");
        tabs.hidden = false;
        tabs.innerHTML = kinds.map(([kind, title]) => `<button data-kind="${kind}">${title}</button>`).join("");
        tabs.addEventListener("click", (event) => {
          if (event.target.dataset.kind) { selected = event.target.dataset.kind; render(); }
        });
        render();
      })
      .catch((error) => {
        document.getElementById("summary").textContent = "Traffic analytics unavailable.";
        document.getElementById("content").innerHTML = `<p class="error">${error}</p>`;
      });
  </script>
</body>
</html>
