services:
  zd1200:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/zd1200-qemu:lab
    container_name: ${ZD_CONTAINER_NAME:-zd1200}
    restart: unless-stopped
    init: true

    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun

    # The optional host/zd1200-bridge service creates the TAP device.
    network_mode: host

    environment:
      CPU_MODEL: pentium3
      MEMORY_MB: "2048"
      NETWORK_MODE: tap
      TAP_IF: ${ZD_TAP_IF:-tap-zd}
      # The host bridge has no IP, so readiness is checked from the LAN.
      WEB_PROBE: ${ZD_WEB_PROBE:-off}
      # Optional informational address (and required only if WEB_PROBE=on).
      # It does not configure the guest; use the ZD wizard for that.
      GUEST_IP: ${ZD_GUEST_IP:-}
      # Optional board identity override. Set both values, or leave both empty
      # to generate and retain a unique locally administered identity.
      ZD_SERIAL: ${ZD_SERIAL:-}
      ZD_MAC1: ${ZD_MAC1:-}
      # Keep RSA; optionally advertise an additional ECDSA host key.
      ZD_ENABLE_ECDSA_SSH: ${ZD_ENABLE_ECDSA_SSH:-0}
      # Opt-in local diagnostic root CLI; it adds no network listener.
      ZD_ENABLE_ROOT_CLI: ${ZD_ENABLE_ROOT_CLI:-0}
      # Optional single-line OpenSSH public key; enables root SSH on port 2222
      # only for release manifests that explicitly support vendor Dropbear.
      ZD_ROOT_SSH_PUBLIC_KEY: ${ZD_ROOT_SSH_PUBLIC_KEY:-}
      # Optional finite support entitlement end date (YYYY-MM-DD).
      ZD_SUPPORT_ENTITLEMENT_END: ${ZD_SUPPORT_ENTITLEMENT_END:-}
      # Work around the 2.6.32 tickless-idle spin demonstrated in cpu-study.
      KERNEL_EXTRA: nohz=off
      WEB_WAIT_SECONDS: "600"
      VM_SNAPSHOT: "0"

    volumes:
      - ${ZD_IMAGE_DIR:-./image}:/opt/zd1200/image:ro
      - zd1200-state:/var/lib/zd1200

    cap_drop:
      - ALL
    # QEMU must issue TUNSETIFF for the pre-created TAP device. Keep the
    # privilege narrow: the container retains no other Linux capabilities.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

    healthcheck:
      test: ["CMD", "/opt/zd1200/zd-healthcheck.sh"]
      interval: 30s
      timeout: 8s
      start_period: 10m
      retries: 3

volumes:
  zd1200-state:
    name: ${ZD_STATE_VOLUME:-zd1200-state}
